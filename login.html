<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveIPO - Admin Central Login</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #0d1b2a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .login-card {
      background: #ffffff;
      padding: 36px 32px;
      border-radius: 14px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
    }

    .login-brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .login-brand .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #2563eb, #10b981);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #fff;
      margin-bottom: 12px;
    }

    .login-brand h2 {
      margin: 0;
      color: #0f172a;
      font-size: 21px;
      font-weight: 800;
    }

    .login-brand p {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      transition: all 0.2s;
    }

    .form-group input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      margin-top: 8px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
    }

    .error-msg {
      color: #dc2626;
      font-size: 13px;
      text-align: center;
      margin-top: 14px;
      font-weight: 600;
      min-height: 18px;
    }

    .login-footer-hint {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #f1f5f9;
      text-align: center;
      font-size: 12px;
      color: #64748b;
    }

    .login-footer-hint strong {
      color: #0f172a;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-brand">
      <div class="logo-icon">📊</div>
      <h2>Admin Central Control</h2>
      <p>Option Selling Management Portal</p>
    </div>

    <form id="loginForm" onsubmit="handleAdminLogin(event)">
      <div class="form-group">
        <label for="adminUser">Admin User ID</label>
        <input type="text" id="adminUser" required placeholder="Enter admin username" autocomplete="username" value="admin">
      </div>
      <div class="form-group">
        <label for="adminPass">Password</label>
        <input type="password" id="adminPass" required placeholder="Enter password" autocomplete="current-password" value="Admin@123">
      </div>
      <button type="submit" class="btn-login">Login to Admin Portal</button>
      <div id="errorMsg" class="error-msg"></div>
    </form>

    <div class="login-footer-hint">
      Default Access: User <strong>admin</strong> | Pass <strong>Admin@123</strong>
      <div style="margin-top: 8px;">
        <a href="index.html" style="color: #2563eb; text-decoration: none; font-weight: 600;">← Go to Frontend Website</a>
      </div>
    </div>
  </div>

  <script>
    function handleAdminLogin(e) {
      e.preventDefault();
      const user = document.getElementById("adminUser").value.trim();
      const pass = document.getElementById("adminPass").value.trim();

      // Check credentials
      if ((user === "admin" && (pass === "Admin@123" || pass === "liveipo2026")) || (user === "superadmin" && pass === "Admin@123")) {
        localStorage.setItem("live_ipo_admin_logged", "true");
        localStorage.setItem("live_ipo_admin_user", user);
        window.location.href = "admin.html";
      } else {
        document.getElementById("errorMsg").innerText = "❌ Invalid Username or Password!";
      }
    }

    // Auto redirect if already logged in
    if (localStorage.getItem("live_ipo_admin_logged") === "true") {
      window.location.href = "admin.html";
    }
  </script>
</body>
</html>
